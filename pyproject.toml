[project]
name = "texture-craft"
version = "2.0.0"
description = "FastAPI & MCP service for generating native 16x16 Minecraft item textures and resource packs for AI plugin generators."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "accelerate>=1.0",
    "diffusers>=0.39",
    "fastapi>=0.115",
    "mcp>=2.3.0",
    "pillow>=11",
    "pydantic>=2.10",
    "safetensors>=0.6",
    "torch>=2.8",
    "transformers>=5.0",
    "uvicorn>=0.34",
]

[project.scripts]
texture-craft-api = "server:main"
texture-craft-mcp = "mcp_server:main"

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
